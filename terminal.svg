<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#ff3df2"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="896" height="296" rx="14" fill="#070914" stroke="url(#tb)" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="36" rx="14" fill="#10142b"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" font-family="monospace" font-size="13" fill="#7b8cff">uzan@kali: ~</text>

  <g font-family="'Fira Code', Consolas, monospace" font-size="16" filter="url(#g)">
    <g opacity="0">
      <text x="28" y="80" fill="#27c93f">uzan@kali<tspan fill="#e6ecff">:~$ </tspan><tspan fill="#00f0ff">whoami</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.5s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="108" fill="#e6ecff">Uzan Khan | Cloud Data Engineer | AI Engineer | Cyber Security Specialist</text>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="148" fill="#27c93f">uzan@kali<tspan fill="#e6ecff">:~$ </tspan><tspan fill="#00f0ff">cat focus.txt</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.8s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="176" fill="#ff3df2">&gt; pipelines   : Kafka, Airflow, dbt, Snowflake, Redshift</text>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.8s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="200" fill="#ff3df2">&gt; cloud       : AWS, Azure, Fabric, Docker, CI/CD</text>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="224" fill="#ff3df2">&gt; security    : Pentesting, OSINT, Forensics, Reverse Engineering</text>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="264" fill="#27c93f">uzan@kali<tspan fill="#e6ecff">:~$ </tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="6s" fill="freeze"/>
    </g>
    <rect x="152" y="250" width="10" height="18" fill="#00f0ff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="6s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
