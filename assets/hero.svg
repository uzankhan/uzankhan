<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#ff3df2"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#bff8ff"/>
      <stop offset="0.35" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#1b0f55"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <!-- perspective grid floor -->
    <g stroke="#3b4cff" stroke-opacity="0.35" stroke-width="1">
      <line x1="500" y1="170" x2="-300" y2="320"/>
      <line x1="500" y1="170" x2="-80" y2="320"/>
      <line x1="500" y1="170" x2="150" y2="320"/>
      <line x1="500" y1="170" x2="380" y2="320"/>
      <line x1="500" y1="170" x2="620" y2="320"/>
      <line x1="500" y1="170" x2="850" y2="320"/>
      <line x1="500" y1="170" x2="1080" y2="320"/>
      <line x1="500" y1="170" x2="1300" y2="320"/>
      <g>
        <line x1="0" y1="190" x2="1000" y2="190"/>
        <line x1="0" y1="215" x2="1000" y2="215"/>
        <line x1="0" y1="245" x2="1000" y2="245"/>
        <line x1="0" y1="282" x2="1000" y2="282"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 18; 0 0" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- floating particles -->
    <g fill="#00f0ff" filter="url(#glow)">
      <circle cx="90" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="260" r="2" fill="#ff3df2"><animate attributeName="cy" values="260;240;260" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="40" r="2" fill="#7b61ff"><animate attributeName="cy" values="40;70;40" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="270" r="2"><animate attributeName="cy" values="270;250;270" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="290" r="2" fill="#ff3df2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- 3D orbit system -->
    <g transform="translate(810 150)">
      <circle r="52" fill="url(#orb)" filter="url(#glow)">
        <animate attributeName="r" values="52;55;52" dur="4s" repeatCount="indefinite"/>
      </circle>
      <g fill="none" stroke-width="2" filter="url(#glow)">
        <g>
          <ellipse rx="130" ry="42" stroke="#00f0ff" stroke-opacity="0.8"/>
          <circle r="6" fill="#00f0ff"><animateMotion dur="5s" repeatCount="indefinite" path="M-130,0 a130,42 0 1,0 260,0 a130,42 0 1,0 -260,0"/></circle>
          <animateTransform attributeName="transform" type="rotate" values="20;380" dur="26s" repeatCount="indefinite"/>
        </g>
        <g>
          <ellipse rx="120" ry="38" stroke="#ff3df2" stroke-opacity="0.8"/>
          <circle r="5" fill="#ff3df2"><animateMotion dur="7s" repeatCount="indefinite" path="M-120,0 a120,38 0 1,0 240,0 a120,38 0 1,0 -240,0"/></circle>
          <animateTransform attributeName="transform" type="rotate" values="-60;300" dur="32s" repeatCount="indefinite"/>
        </g>
        <g>
          <ellipse rx="110" ry="34" stroke="#7b61ff" stroke-opacity="0.9"/>
          <circle r="5" fill="#7b61ff"><animateMotion dur="9s" repeatCount="indefinite" path="M-110,0 a110,34 0 1,0 220,0 a110,34 0 1,0 -220,0"/></circle>
          <animateTransform attributeName="transform" type="rotate" values="90;450" dur="40s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="48" y="112" font-size="20" fill="#7b8cff" letter-spacing="6" font-weight="600">HELLO WORLD, I'M</text>
      <text x="46" y="182" font-size="72" font-weight="800" fill="url(#neon)" filter="url(#glow)" letter-spacing="2">UZAN KHAN</text>

      <g font-size="22" fill="#e6ecff" font-weight="500">
        <text x="50" y="228" opacity="0">&#9729; Cloud Data Engineer
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
        <text x="50" y="228" opacity="0">&#129302; AI Engineer
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
        <text x="50" y="228" opacity="0">&#128737; Cyber Security Specialist
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
      </g>
      <text x="50" y="268" font-size="15" fill="#8d97c9" letter-spacing="1">Build secure. Scale smart. Ship fast.</text>
    </g>

    <!-- scanning line -->
    <rect x="0" y="0" width="1000" height="2" fill="#00f0ff" opacity="0.25">
      <animate attributeName="y" values="0;320;0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect width="1000" height="320" rx="18" fill="none" stroke="url(#neon)" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
